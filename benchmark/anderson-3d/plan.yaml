# A draft started with `flower start`: the run exists from the first minute and grows step by step.
# Each addition is a recorded amendment of the run (see `flower log RUN`).
#   add a step and run it:   flower add RUN ID -- <command>         (on a cluster: --cluster C --env E)
#   or edit this file, then: flower rerun RUN ID --follow   (or `flower sync RUN`: apply edits, re-run nothing)
# New `inputs:` (with a default, or `-i NAME=VALUE`) and new `clusters:` are picked up the same way; of an
# existing cluster, only cpus / max_jobs / min_poll may change.

flower: 1
id: anderson-3d
title: "Reproduce the critical disorder W_c = 16.54(2) and the localization-length exponent nu = 1.57(2) of the 3D Anderson transition (box distribution), from transfer-matrix localization lengths of L x L bars and finite-size scaling with corrections (Tables II and III of Slevin and Ohtsuki, PRL 82, 382 (1999), arXiv:cond-mat/9812065)"
description: |
  Reproduce the critical disorder W_c = 16.54(2) and the localization-length exponent nu = 1.57(2) of the 3D Anderson transition (box distribution), from transfer-matrix localization lengths of L x L bars and finite-size scaling with corrections (Tables II and III of Slevin and Ohtsuki, PRL 82, 382 (1999), arXiv:cond-mat/9812065)

clusters:
  local: {transport: local, scheduler: none, cpus: 24}   # a fair share of this shared 96-core machine
  here: {transport: local, scheduler: none}   # quick analysis steps, outside the campaign's budget

nodes:
  - id: paper
    kind: shell
    description: 'Downloads the paper (arXiv PDF, sha256) and parses Tables II and III: W_c, Lambda_c and nu with their 95% intervals, for the box, Gaussian and Lorentz distributions. Read box_Wc and box_nu: the claims.'
    outputs:
      sha256_pdf: string
      sizes: array
      box_Wc: object
      box_nu: object
      box_Lc: object
    files:
      pdf: paper.pdf
      tables: tables.json
    run: curl -fsSL -A "Mozilla/5.0" -o paper.pdf https://arxiv.org/pdf/cond-mat/9812065v1 && pdftotext -layout paper.pdf paper.txt && python3 ${plan.dir}/tables.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: check
    kind: shell
    description: The numba transfer-matrix kernel against a dense numpy calculation on the same potentials (L = 2 and 3), and the symplectic pairing (s, 1/s) of the transfer matrix''s singular values. Read L2_dev, L3_dev (below 1e-9) and L*_pair (below 1e-6).
    environment: numba
    stage_in:
    - tm.py
    outputs:
      ok: boolean
      L2_dev: number
      L3_dev: number
      L2_pair: number
      L3_pair: number
    run: python3 tm.py check | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: smoke
    kind: shell
    title: 'Smoke: L=${item.L}, W=16.5'
    description: 'Two runs near the transition (W = 16.5, L = 8 and 12) to a 0.5% target: time per step and the steps a given accuracy needs, to size the campaign. Not used in the result.'
    needs:
    - check
    environment: numba
    stage_in:
    - tm.py
    env:
      OMP_NUM_THREADS: '1'
    foreach:
    - L: 8
    - L: 12
    outputs:
      Lambda: number
      rel_err: number
      steps: integer
      seconds: number
    run: python3 tm.py run ${item.L} 16.5 0.005 2000000 | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: tm
    kind: shell
    title: 'Lambda: L=${item.L}, W=${item.W}'
    description: The reduced localization length Lambda = 1/(gamma L) of an L x L bar at disorder W (box distribution, E = 0) to 0.1 % (the paper's accuracy), the data of the finite-size-scaling fit. Read Lambda and rel_err.
