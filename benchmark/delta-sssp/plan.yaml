# A draft started with `flower start`: the run exists from the first minute and grows step by step; every change
# of this file is recorded in the run (`flower log RUN`).
#   add a step and run it:  flower add RUN ID -- <command>   (on a cluster: --cluster C --env E; --follow to watch)
#   or edit this file, then: flower rerun RUN [ID]           (applies the edits; with ID, runs that step again)
# New `inputs:` (with a default, or `-i NAME=VALUE`) and `clusters:` are picked up the same way; of an existing
# cluster, only cpus / max_jobs / min_poll may change.

flower: 1
id: delta-sssp
title: "Reproduce the Delta-factor verification of the SSSP efficiency pseudopotential library against all-electron WIEN2k equations of state for the 71 elemental crystals (Lejaeghere et al., Science 351, aad3000 (2016); Prandini et al., npj Comput. Mater. 4, 72 (2018), arXiv:1806.05609) with Quantum ESPRESSO"
description: |
  Reproduce the Delta-factor verification of the SSSP efficiency pseudopotential library against all-electron WIEN2k equations of state for the 71 elemental crystals (Lejaeghere et al., Science 351, aad3000 (2016); Prandini et al., npj Comput. Mater. 4, 72 (2018), arXiv:1806.05609) with Quantum ESPRESSO

inputs:
  kspacing: {type: number, default: 0.1, description: "k-point spacing in 1/A (2pi included)"}
  degauss: {type: number, default: 0.01, description: "Marzari-Vanderbilt smearing in Ry"}
  host: {type: string, required: true, description: "ssh alias of the remote machine"}
  ssh_options: {type: array, required: true, description: 'extra ssh/rsync options, e.g. ["-F", "/path/ssh_config"]'}

clusters:
  remote: {transport: ssh, host: "${inputs.host}", ssh_options: "${inputs.ssh_options}", scheduler: none,
           remote_root: ~/flower-runs, min_poll: 15s, cpus: 30}

nodes:
  - id: sources
    kind: shell
    title: Delta package (pinned commit), SSSP 1.1 PBE efficiency, the SSSP paper (sha256)
    description: 'Downloads and hashes everything the study starts from: the Delta package at a pinned commit (CIFs, WIEN2k reference, published results), SSSP 1.1 efficiency, and the SSSP paper. n_cifs, n_pseudos and n_wien2k should be 71, 85 and 71.'
    outputs:
      delta_zip_sha256: string
      sssp_tar_sha256: string
      sssp_json_sha256: string
      paper_sha256: string
      n_cifs: integer
      n_pseudos: integer
      n_wien2k: integer
    files:
      sssp_json: sssp.json
      wien2k: delta/WIEN2k.txt
      paper: paper.pdf
    run: python3 ${plan.dir}/sources.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: structures
    kind: shell
    title: 'pw.x inputs: 71 crystals x 7 volumes (94-106 % of V0 WIEN2k), SSSP cutoffs, magnetism per the Delta protocol'
    description: 'Writes the pw.x inputs: each of the 71 crystals at 94-106 % of the WIEN2k volume, at SSSP''s recommended cutoffs, k-spacing 0.1/A, magnetism per the Delta protocol. items lists the elements, most expensive first, for the eos fan-out.'
    environment: ase
    outputs:
      items: array
      n: integer
    inputs:
      wien2k: ${sources.files.wien2k}
      sssp_json: ${sources.files.sssp_json}
      kspacing: ${inputs.kspacing}
      degauss: ${inputs.degauss}
    run: python3 ${plan.dir}/structures.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: eos-smoke
    kind: shell
    title: 'Smoke test: EOS of ${item.el}'
    description: 'A first equation of state for Si and Fe (magnetic) to test the pw.x pipeline end to end. Not used in the result.'
    cluster: remote
    environment: qe
    stage_in:
    - ${plan.dir}/eos.sh
    - ${structures.outputs.local_dir}/inputs/${item.el}
    timeout:
      total: 2h
    resources:
      cpus_per_task: 4
    foreach:
    - el: Si
    - el: Fe
    outputs:
      el: string
      V: array
      E: array
      mag: array
      iterations: array
    run: bash eos.sh ${item.el} $FLOWER_CPUS | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta-smoke
    kind: shell
    title: Delta on the smoke-test elements (checks the analysis and its port of calcDelta.py)
    description: 'The Delta analysis on the smoke elements, to test the script and its port of calcDelta.py (port_max_diff about 1e-3 meV/atom or less). Not used in the result.'
    environment: ase
    outputs:
      n_elements: integer
      avg_delta: number
      paper_avg_delta: number
      avg_delta_history_entry: number
      port_max_diff: number
      worst: array
      n_outside_96_104: integer
      failed: array
    files:
      report: report.md
      table: ours.txt
      figure: delta.png
    inputs:
      eos: ${eos-smoke.outputs.items}
      wien2k: ${sources.files.wien2k}
    run: python3 ${plan.dir}/delta.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: eos
    kind: shell
    title: 'EOS of ${item.el}: 7 volumes with pw.x (SSSP 1.1 efficiency)'
    description: 'pw.x energies of one element at its seven volumes, checkpointed per volume. V and E (per atom) feed the delta step; mag is the total magnetization (zero for the antiferromagnets).'
    cluster: remote
    environment: qe
    stage_in:
    - ${plan.dir}/eos.sh
    - ${structures.outputs.local_dir}/inputs/${item.el}
    timeout:
      total: 24h
    resources:
      cpus_per_task: 4
    foreach: ${structures.outputs.items}
    outputs:
      el: string
      V: array
      E: array
      mag: array
      iterations: array
    retry:          # a time limit is retried too: each volume is checkpointed in $FLOWER_STATE_DIR
      max_attempts: 3
      on: [lost, node_fail, remote, transient, timeout]
    on_failure: continue
    run: bash eos.sh ${item.el} $FLOWER_CPUS | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta
    kind: shell
    title: Delta factor vs WIEN2k over all elements, and vs the published QE + SSSP efficiency entry
    description: 'Birch-Murnaghan fits and the Delta factor of every element against WIEN2k, and against the published QE + SSSP entry. Read report.md: avg_delta (the paper: 0.44 meV/atom), the per-element table, and port_max_diff.'
    environment: ase
    outputs:
      n_elements: integer
      avg_delta: number
      paper_avg_delta: number
      avg_delta_history_entry: number
      port_max_diff: number
      worst: array
      n_outside_96_104: integer
      failed: array
    files:
      report: report.md
      table: ours.txt
      figure: delta.png
      data: delta.json
    trigger: all_done
    inputs:
      eos: ${eos.outputs.items}
      wien2k: ${sources.files.wien2k}
    run: python3 ${plan.dir}/delta.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta-preview
    kind: shell
    title: Delta on the elements finished so far (preview)
    description: 'The Delta analysis on the elements finished so far; rerun it to refresh.'
    environment: ase
    outputs:
      n_elements: integer
      avg_delta: number
      worst: array
      failed: array
    files:
      report: report.md
    inputs:
      eos: ${eos.partial}
      wien2k: ${sources.files.wien2k}
    run: python3 ${plan.dir}/delta.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: structures-hicut
    kind: shell
    title: pw.x inputs at 1.5x the recommended cutoffs for the elements furthest from the published QE+SSSP entry
    description: 'pw.x inputs at 1.5x the recommended cutoffs for the nine elements furthest from the published entry: is the gap to the paper the cutoff?'
    environment: ase
    outputs:
      items: array
      n: integer
    inputs:
      wien2k: ${sources.files.wien2k}
      sssp_json: ${sources.files.sssp_json}
      kspacing: ${inputs.kspacing}
      degauss: ${inputs.degauss}
      ecut_scale: 1.5
      elements: [Au, Hg, N, F, O, Cr, Fe, Ta, W]
    run: python3 ${plan.dir}/structures.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: eos-hicut
    kind: shell
    title: EOS of ${item.el} at 1.5x the recommended cutoffs
    description: 'Equation of state of one outlier at 1.5x the cutoffs; compare with the same element in eos.'
    cluster: remote
    environment: qe
    stage_in:
    - ${plan.dir}/eos.sh
    - ${structures-hicut.outputs.local_dir}/inputs/${item.el}
    timeout:
      total: 24h
    resources:
      cpus_per_task: 4
    foreach: ${structures-hicut.outputs.items}
    outputs:
      el: string
      V: array
      E: array
      mag: array
      iterations: array
    retry:
      max_attempts: 3
    on_failure: continue
    run: bash eos.sh ${item.el} $FLOWER_CPUS | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta-hicut
    kind: shell
    title: Delta at 1.5x the cutoffs (is the gap to the paper the cutoff?)
    description: 'Delta of the outliers at 1.5x the cutoffs. An element whose Delta does not change is not limited by the cutoff.'
    environment: ase
    outputs:
      n_elements: integer
      avg_delta: number
      worst: array
      failed: array
    files:
      report: report.md
      data: delta.json
    trigger: all_done
    inputs:
      eos: ${eos-hicut.outputs.items}
      wien2k: ${sources.files.wien2k}
    run: python3 ${plan.dir}/delta.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: structures-smear
    kind: shell
    title: pw.x inputs with the paper's smearing (0.002 Ry) and a denser k-mesh (0.07 1/A) for five metals
    description: 'pw.x inputs for five metals with the paper''s smearing (0.002 Ry) and a denser k-mesh (0.07/A): is the gap the smearing?'
    environment: ase
    outputs:
      items: array
      n: integer
    inputs:
      wien2k: ${sources.files.wien2k}
      sssp_json: ${sources.files.sssp_json}
      kspacing: 0.07
      degauss: 0.002
      elements:
      - Au
      - Hg
      - Cu
      - Pt
      - Cd
    run: python3 ${plan.dir}/structures.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: eos-smear
    kind: shell
    title: EOS of ${item.el}, smearing 0.002 Ry, k-spacing 0.07 1/A
    description: 'Equation of state of one metal with the paper''s smearing and the denser k-mesh.'
    cluster: remote
    environment: qe
    stage_in:
    - ${plan.dir}/eos.sh
    - ${structures-smear.outputs.local_dir}/inputs/${item.el}
    timeout:
      total: 24h
    resources:
      cpus_per_task: 4
    foreach: ${structures-smear.outputs.items}
    outputs:
      el: string
      V: array
      E: array
      mag: array
      iterations: array
    retry:
      max_attempts: 3
    on_failure: continue
    run: bash eos.sh ${item.el} $FLOWER_CPUS | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta-smear
    kind: shell
    title: Delta of five metals with the paper's smearing (is the gap the smearing?)
    description: 'Delta of the five metals with the paper''s smearing; compare with delta. Unchanged values rule the smearing out.'
    environment: ase
    outputs:
      n_elements: integer
      avg_delta: number
      worst: array
      failed: array
    files:
      report: report.md
      data: delta.json
    trigger: all_done
    inputs:
      eos: ${eos-smear.outputs.items}
      wien2k: ${sources.files.wien2k}
    run: python3 ${plan.dir}/delta.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: delta-reference
    kind: shell
    title: Published QE Delta values (all pseudopotential families in the package history) for the outliers
    description: 'The Delta of every published QE pseudopotential family in the package history, for the outliers: shows whether a large Delta belongs to the pseudopotential file rather than to this run.'
    environment: ase
    outputs:
      sections: integer
      delta: object
    files:
      data: reference.json
    inputs:
      wien2k: ${sources.files.wien2k}
      elements:
      - Au
      - Hg
      - Pt
      - Cd
      - Cu
      - N
      - F
      - O
      - Cr
      - Fe
      - Mn
    run: python3 ${plan.dir}/delta.py reference | tail -n 1 > "$FLOWER_OUTPUTS"
