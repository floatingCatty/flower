# A reproducibility protocol exported from run eam-elastic-20261004-235527-038f (`flower export`): the steps behind
# analysis. Run it with `flower run protocol.yaml --follow`, then `flower compare RUN expected.json`.
flower: 1
id: eam-elastic
title: Reproduce the room-temperature elastic constants C11, C12, C44 of Cu, Al and Ni predicted by the EAM interatomic
  potentials of Tables 1-3 of Rassoulinejad-Mousavi, Mao and Zhang, J. Appl. Phys. 119, 245102 (2016), arXiv:1605.09237,
  by LAMMPS molecular dynamics at 300 K
description: |
  Reproduce the room-temperature elastic constants C11, C12, C44 of Cu, Al and Ni predicted by the EAM interatomic potentials of Tables 1-3 of Rassoulinejad-Mousavi, Mao and Zhang, J. Appl. Phys. 119, 245102 (2016), arXiv:1605.09237, by LAMMPS molecular dynamics at 300 K
inputs:
  host:
    type: string
    required: true
  ssh_options:
    type: array
    required: true
clusters:
  remote:
    transport: ssh
    host: ${inputs.host}
    ssh_options: ${inputs.ssh_options}
    scheduler: none
    remote_root: ~/flower-runs
    min_poll: 15s
    cpus: 32
nodes:
- id: paper
  kind: shell
  description: 'Downloads the paper (arXiv PDF, sha256) and parses Tables 1-3: C11, C12, C44 at 300 K per potential
    file and each table''s experimental reference. Read rows (17 Cu, 24 Al, 19 Ni when intact) and complete (rows
    with all six numbers).'
  outputs:
    sha256_pdf: string
    rows: object
    complete: object
    experiment: object
  files:
    pdf: paper.pdf
    tables: tables.json
  run: curl -fsSL -A "Mozilla/5.0" -o paper.pdf https://arxiv.org/pdf/1605.09237v1 && pdftotext -layout paper.pdf
    paper.txt && python3 ${plan.dir}/tables.py | tail -n 1 > "$FLOWER_OUTPUTS"
- id: potentials
  kind: shell
  description: 'Fetches the potential files named in Tables 1-3 by exact file name, from the LAMMPS repository (release
    stable_2Aug2023_update3) or else the NIST repository''s Cu, Al and Ni pages, with sha256. Read n_found and missing:
    only found files can be tested; missing ones are listed, not guessed.'
  outputs:
    tag: string
    n_found: integer
    n_missing: integer
    missing: array
    pairs: integer
    from_nist: integer
    items: array
  files:
    index: potentials.json
  run: python3 ${plan.dir}/fetch.py "${paper.files.tables}" stable_2Aug2023_update3 | tail -n 1 > "$FLOWER_OUTPUTS"
- id: elastic
  kind: shell
  title: C11, C12, C44 of ${item.metal} with ${item.pot} at 300 K
  description: 'One metal with one potential, 16384 atoms at 300 K: the linear elastic constants by symmetric +-1%
    strains (C11, C12, C44 with block errors), and the paper''s protocol (constant-rate tension and shear, slopes
    C*_rate_0.5 / _1 / _2 fitted on 0-0.5%, 1%, 2% strain). Compare both with the paper''s row for this file.'
  cluster: remote
  environment: lammps
  stage_in:
  - elastic.py
  - ${potentials.dir}/potentials/${item.pot}
  timeout:
    total: 3h
  resources:
    cpus_per_task: 8
  foreach: ${potentials.outputs.items}
  outputs:
    a300: number
    C11: number
    C12: number
    C44: number
  files:
    result: elastic.json
  on_failure: continue
  run: python3 elastic.py ${item.metal} ${item.pot} 16 20 | tail -n 1 > "$FLOWER_OUTPUTS"
- id: analysis
  kind: shell
  description: 'This run''s elastic constants against Tables 1-3: a row is reproduced when C11, C12 and C44 are
    all within 5% of this run''s values from the paper''s own protocol; also how far that protocol sits from the
    linear constants, the order of the potentials, and the rows that are not reproduced. Read n_reproduced of n_rows
    and report.md.'
  environment: analysis
  outputs:
    n_rows: integer
    n_reproduced: integer
    n_not_found: integer
    not_reproduced: array
  files:
    report: report.md
    figure: parity.png
    data: analysis.json
  inputs:
    tables: ${paper.files.tables}
    index: ${potentials.files.index}
    results: ${elastic.outputs.items}
  run: python3 ${plan.dir}/analysis.py | tail -n 1 > "$FLOWER_OUTPUTS"
