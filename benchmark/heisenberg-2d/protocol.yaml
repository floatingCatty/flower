- id: fits
  kind: shell
  title: Per-size data vs Table II; extrapolations of E, M, rho_s, chi, c (L >= 6)
  description: 'Compares every size with the paper''s Table II and repeats the paper''s unconstrained fits (L >=
    6) to get E, M, rho_s, chi and c in the infinite system. Read report.md: n_reproduced of n_claims, with z-scores.'
  environment: analysis
  outputs:
    n_claims: integer
    n_reproduced: integer
    E_inf: number
    E_inf_err: number
    M: number
    M_err: number
    sizes: array
  files:
    report: report.md
    figure: fits.png
    data: fits.json
  inputs:
    runs: ${sse.outputs.items}
    table2: ${paper.files.table2}
    lmin: 6
  run: python3 ${plan.dir}/fits.py | tail -n 1 > "$FLOWER_OUTPUTS"
