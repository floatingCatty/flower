[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flower"
version = "0.1.0"
description = "Durable, file-first workflow CLI for long-running agent + HPC research workflows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.4", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flower = "flower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flower = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
