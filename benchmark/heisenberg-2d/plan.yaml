      resumed: boolean
      seconds: number
    files:
      bins: bins.npz
    retry:
      max_attempts: 2
    run: python3 sse.py ${item.L} $((8 * ${item.L})) 250000 ${item.seed} | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: fits
    kind: shell
    title: Per-size data vs Table II; extrapolations of E, M, rho_s, chi, c (L >= 6)
    environment: analysis
    outputs:
      n_claims: integer
      n_reproduced: integer
      E_inf: number
      E_inf_err: number
      M: number
      M_err: number
      sizes: array
    files:
      report: report.md
      figure: fits.png
      data: fits.json
    inputs:
      runs: ${sse.outputs.items}
      table2: ${paper.files.table2}
      lmin: 6
    run: python3 ${plan.dir}/fits.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: fits-preview
    kind: shell
    title: The fits on the chains finished so far (preview)
    environment: analysis
    outputs:
      sizes: array
    files:
      report: report.md
    inputs:
      runs: ${sse.partial}
      table2: ${paper.files.table2}
      lmin: 6
    run: python3 ${plan.dir}/fits.py | tail -n 1 > "$FLOWER_OUTPUTS"
