flower: 1
id: si-dos-fermi
title: Silicon DOS and Fermi level from occupation-function integration (ABACUS)
description: |
  Compute the electronic density of states of bulk diamond Si with ABACUS (PBE, LCAO DZP basis)
  and extract the Fermi level by solving  ∫ g(E) f_FD(E; E_F, T) dE = N_e  on the DOS.
  An SCF run on a coarse k-mesh gives the charge density; non-self-consistent runs on a series of
  denser k-meshes give the DOS; each DOS is integrated against the Fermi-Dirac occupation; the
  k-mesh series shows whether E_F is converged. Si is an insulator, so E_F should sit near midgap,
  unlike the T≈0 smearing value that ABACUS reports, which can be anywhere in the gap.

inputs:
  abacus_env: {type: string, required: true,
               description: conda env with abacus, mpirun and numpy/scipy/matplotlib}
  pp_dir: {type: string, required: true,
           description: directory with the pseudopotential and the numerical orbital}
  pseudo: {type: string, default: Si_ONCV_PBE-1.0.upf}
  orbital: {type: string, default: Si_gga_8au_100Ry_2s2p1d.orb}
  alat_bohr: {type: number, default: 10.26, description: cubic lattice constant (bohr)}
  np: {type: integer, default: 8, description: MPI ranks per ABACUS run}
  scf_kmesh: {type: integer, default: 8}
  dos_kmeshes: {type: array, default: [8, 12, 16, 24], description: n of the n×n×n nscf meshes}
  temperature_K: {type: number, default: 300, description: temperature of the Fermi-Dirac occupation}
  ef_tol_meV: {type: number, default: 5, description: k-convergence tolerance on E_F}

defaults:
  timeout: {total: 30m, idle: 15m}
  retry: {max_attempts: 1}
  concurrency: 2


nodes:
  - id: prepare
    kind: shell
    title: Build Si structure, count electrons
    description: 'Builds the silicon structure and counts the valence electrons ABACUS needs.'
    run: |
      ${inputs.abacus_env}/bin/python - <<'EOF'
      import json, os, sys
      sys.path.insert(0, "${plan.dir}")
      from abacus_si import prepare
      args = json.load(open(os.environ["FLOWER_INPUTS"]))
      json.dump(prepare(**args, ctx={"workdir": os.getcwd()}), open(os.environ["FLOWER_OUTPUTS"], "w"), default=str)
      EOF
    inputs: {pp_dir: "${inputs.pp_dir}", pseudo: "${inputs.pseudo}", orbital: "${inputs.orbital}",
           alat_bohr: "${inputs.alat_bohr}"}
    outputs: {stru: path, pp_dir: string, nelec: number, alat_angstrom: number}
    files: {stru: STRU}

  - id: scf
    kind: shell
    title: ABACUS SCF (charge density)
    description: 'Self-consistent ABACUS run for the charge density; converged must be true, and etot_eV and ef_abacus_eV are the reference values.'
    env: {OMP_NUM_THREADS: "1"}
    run: |
      PY=${inputs.abacus_env}/bin/python
      cp ${prepare.outputs.stru} STRU
      $PY ${plan.dir}/abacus_si.py write-input scf ${inputs.scf_kmesh} ${prepare.outputs.pp_dir}
      ${inputs.abacus_env}/bin/mpirun -np ${inputs.np} ${inputs.abacus_env}/bin/abacus > abacus.out 2>&1
      $PY ${plan.dir}/abacus_si.py parse OUT.si scf > "$FLOWER_OUTPUTS"
    outputs: {out_dir: string, ef_abacus_eV: number, etot_eV: number, converged: boolean, nelec_abacus: number}
    files: {log: OUT.si/running_scf.log}

  - id: dos
    kind: shell
    title: ABACUS nscf DOS
    description: 'Non-self-consistent density of states on one k-mesh, from the scf charge density.'
    foreach: "${inputs.dos_kmeshes}"
    when: "${scf.outputs.converged}"
    env: {OMP_NUM_THREADS: "1"}
    run: |
      PY=${inputs.abacus_env}/bin/python
      cp ${prepare.outputs.stru} STRU
      $PY ${plan.dir}/abacus_si.py write-input nscf ${item} ${prepare.outputs.pp_dir} ${scf.outputs.out_dir}
      ${inputs.abacus_env}/bin/mpirun -np ${inputs.np} ${inputs.abacus_env}/bin/abacus > abacus.out 2>&1
      $PY ${plan.dir}/abacus_si.py parse OUT.si nscf > out.json
      $PY -c "import json,sys; d=json.load(open('out.json')); d['kmesh']=${item}; json.dump(d, open(sys.argv[1],'w'))" "$FLOWER_OUTPUTS"
    outputs: {kmesh: integer, out_dir: string, ef_abacus_eV: number, nk_ibz: integer}
    files: {dos: OUT.si/DOS1_smearing.dat, dos_raw: OUT.si/DOS1}

  - id: fermi
    kind: shell
    title: E_F by Fermi-Dirac integration of the DOS
    description: 'Finds the Fermi level by integrating the DOS with Fermi-Dirac occupations, and the band edges; for silicon ef_fd_eV lies in the gap (insulator true).'
    foreach: "${dos.outputs.items}"
    run: |
      ${inputs.abacus_env}/bin/python - <<'EOF'
      import json, os, sys
      sys.path.insert(0, "${plan.dir}")
      from abacus_si import fermi_from_dos
      args = json.load(open(os.environ["FLOWER_INPUTS"]))
      json.dump(fermi_from_dos(**args, ctx={"workdir": os.getcwd()}), open(os.environ["FLOWER_OUTPUTS"], "w"), default=str)
      EOF
    inputs: {out_dir: "${item.out_dir}", kmesh: "${item.kmesh}", ef_abacus_eV: "${item.ef_abacus_eV}",
           nelec: "${prepare.outputs.nelec}", temperature_K: "${inputs.temperature_K}"}
    outputs: {kmesh: integer, ef_fd_eV: number, ef_fd_smeared_dos_eV: number, ef_abacus_eV: number,
              vbm_eV: number, cbm_eV: number, gap_eV: number, midgap_eV: number,
              ef_minus_midgap_meV: number, insulator: boolean, plot: path}

  - id: converge
    kind: shell
    title: k-point convergence of E_F
    description: 'Checks that the Fermi level is converged with the k-mesh: delta_last_meV between the two densest meshes, converged true when it is small.'
    run: |
      ${inputs.abacus_env}/bin/python - <<'EOF'
      import json, os, sys
      sys.path.insert(0, "${plan.dir}")
      from abacus_si import converge
      args = json.load(open(os.environ["FLOWER_INPUTS"]))
      json.dump(converge(**args, ctx={"workdir": os.getcwd()}), open(os.environ["FLOWER_OUTPUTS"], "w"), default=str)
      EOF
    inputs: {results: "${fermi.outputs.items}", tol_meV: "${inputs.ef_tol_meV}"}
    outputs: {table: array, ef_eV: number, gap_eV: number, kmesh: integer, delta_last_meV: number,
              converged: boolean, plot: path}
    files: {plot: convergence.png}
