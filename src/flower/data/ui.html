<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flower</title>
<!--
  Visual language: Eleforge (DESIGN.md, apps/web/src/index.css) and its canvas "constellation" renderer
  (apps/web/src/capabilities/canvas/ui/constellation-node*.tsx, blueprint-detail-panel.tsx), measured against
  a real render of ConstellationNode:
    run  = 48px "folder" circle, 3px border, folder icon, title label to the right
    node = 36px circle, 2px border in TYPE_COLORS, 14px Lucide icon, bg white/90
    status (getBorderStyle): pending dashed colour+80 · running two-tone comet arc (inset -3px, 2.5px, 1.2s)
      · success breathe glow 3s · failed #ef4444 · needs-you amber #f59e0b 2px + pulse
    edges: smoothstep orthogonal, colour of the target, 1.6px (skip 1.2 dashed 4 3), 7px arrow, hover 2.4 / dim 0.12
    layout: git-graph lanes (computeBranchColumns), 24px dot grid on --canvas-bg
    panels: floating cards, 16px radius, 1px #E4E4E7 border, 10px uppercase card titles
  Icons: path data from Lucide (ISC licence).
-->
<style>
:root {
  --canvas: #FAFAFA; --dot: oklch(0.85 0.002 60); --panel: #FFFFFF; --elev: #F4F4F5; --hover: #E4E4E7; --border: #E4E4E7;
  --border-focus: #D4D4D8; --text: #18181B; --text2: #71717A; --text3: #A1A1AA; --accent: #2563EB;
  --accent-bg: rgba(37, 99, 235, 0.08); --accent-ring: rgba(37, 99, 235, 0.25);
  --success: #16A34A; --warning: #D97706; --error: #DC2626; --radius: 16px;
  --node-fill: rgba(255, 255, 255, 0.9); --edge-opacity: 0.9; --skip-opacity: 0.5; --tip-border: #D6D3D1;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06); --tip-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
  --sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
:root.dark {
  --canvas: #06080A; --dot: oklch(0.35 0.01 30); --panel: #121214; --elev: #1D1D20; --hover: #27272A; --border: #27272A;
  --border-focus: #3F3F46; --text: #EDEDEF; --text2: #8B8B93; --text3: #52525B; --accent: #0A84FF;
  --accent-bg: rgba(10, 132, 255, 0.12); --accent-ring: rgba(10, 132, 255, 0.3);
  --success: #22C55E; --warning: #F59E0B; --error: #EF4444; --radius: 20px;
  --node-fill: rgba(28, 25, 23, 0.8); --edge-opacity: 0.72; --skip-opacity: 0.4; --tip-border: rgba(68, 64, 60, 0.6);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.4); --tip-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
}
/* ---------- type scale (Eleforge DESIGN.md: a deliberately short scale; emphasis via weight/colour, not size) ----------
   title    16px/600  lh 1.35  -0.01em   panel header: run / node name
   section  10px/700  UPPERCASE +0.06em  card titles (Eleforge h3), text2
   label    12px/600                     headings inside a card: decision, attempt, generation
   body     14px/400  lh 1.6             reading text: goal, summary, rationale, decision question
   caption  12px/400  lh 1.5             metadata, key/value keys, timeline, controls (the UI default)
   micro    10px/400–600                 chips, badges, hints, legend
   mono     11px/400  tabular-nums       ids, digests, paths, numbers, code, logs
   numeral  16px/600  mono               stat values                                                          */
:root { --fs-title: 16px; --fs-body: 14px; --fs-caption: 12px; --fs-micro: 10px; --fs-mono: 11px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--text); font: 400 var(--fs-caption)/1.5 var(--sans); overflow: hidden;
       -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button { font: 500 var(--fs-caption)/1 var(--sans); cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
         color: var(--text); padding: 0 10px; height: 28px; white-space: nowrap; transition: background-color 160ms cubic-bezier(.4,0,.2,1), border-color 160ms; }
button:hover { background: var(--elev); border-color: var(--border-focus); }
button:active { transform: scale(0.98); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--error); }
button.ghost { background: transparent; border-color: transparent; color: var(--text2); }
button.ghost:hover { background: var(--elev); color: var(--text); }
input, textarea, select { font: 400 var(--fs-caption)/1.5 var(--sans); color: var(--text); background: var(--panel); border: 1px solid var(--border);
       border-radius: 8px; padding: 6px 8px; width: 100%; outline: none; transition: border-color 160ms, box-shadow 160ms; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
input::placeholder, textarea::placeholder { color: var(--text3); }
textarea { resize: vertical; display: block; }
textarea.code { font: 400 var(--fs-mono)/1.6 var(--mono); }
.mono { font-family: var(--mono); font-size: var(--fs-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
pre { font: 400 var(--fs-mono)/1.6 var(--mono); background: var(--elev); color: var(--text); border-radius: 8px; padding: 10px 12px;
      margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; tab-size: 2; }
pre.log { background: #171717; color: #E5E5E5; }
a { color: var(--accent); text-decoration: none; font-weight: 500; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 6px; }

/* type utilities */
.t-title { font-size: var(--fs-title); font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
.t-label { font-size: var(--fs-caption); font-weight: 600; line-height: 1.4; }
.t-body, .prose { font-size: var(--fs-body); line-height: 1.6; color: var(--text); }
.small { font-size: var(--fs-caption); } .tiny { font-size: var(--fs-micro); line-height: 1.5; }
.muted { color: var(--text2); } .faint { color: var(--text3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
#top { position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px;
       background: var(--panel); border-bottom: 1px solid var(--border); z-index: 5; min-width: 0; }
.brand { font-weight: 700; font-size: var(--fs-title); letter-spacing: -0.02em; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 700; }
.sep { width: 1px; height: 20px; background: var(--border); flex: none; }
#runselect { width: auto; max-width: 360px; height: 30px; padding: 0 8px; background: var(--elev); border-color: transparent; font-weight: 500; }
#topstatus { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--text2); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.minibar { width: 96px; height: 4px; border-radius: 4px; background: var(--elev); overflow: hidden; display: flex; flex: none; }
.minibar div, .bar div { height: 100%; }
.sp { flex: 1; }
#who { color: var(--text3); font-size: var(--fs-micro); white-space: nowrap; }

/* ---------- canvas + floating inspector ---------- */
#canvas { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; overflow: hidden; cursor: grab;
          background-color: var(--canvas); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
#canvas.dragging { cursor: grabbing; }
#inspector { position: absolute; top: 56px; right: 8px; bottom: 8px; width: 384px; background: var(--panel); border: 1px solid var(--border);
             border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 4; }
.tabs { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
.tab { padding: 5px 10px; font-weight: 500; line-height: 1.4; color: var(--text2); cursor: pointer; border-radius: 6px; display: flex; gap: 6px; align-items: center;
       transition: background-color 160ms, color 160ms; }
.tab:hover { color: var(--text); background: var(--elev); }
.tab.active { color: var(--text); background: var(--elev); font-weight: 600; }
.tab .count { background: #f59e0b; color: #fff; border-radius: 9999px; font-size: var(--fs-micro); min-width: 16px; padding: 0 5px; font-weight: 700; line-height: 16px; text-align: center; }
#pane { flex: 1; overflow: auto; }

/* ---------- inspector building blocks (blueprint-detail-panel) ---------- */
.ph { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.ph .ib { width: 36px; height: 36px; border-radius: 8px; border: 1px solid; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ph h2 { margin: 0; word-break: break-word; }
.ph .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.ph .desc { font-size: var(--fs-caption); color: var(--text2); line-height: 1.5; margin-top: 8px; }
.badge { font-size: var(--fs-micro); font-weight: 600; text-transform: uppercase; padding: 0 6px; border-radius: 4px; letter-spacing: .06em; white-space: nowrap; line-height: 18px; }
.body { padding: 12px; }
.card { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.sh { font-size: var(--fs-micro); font-weight: 700; line-height: 1.4; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px;
      display: flex; align-items: center; gap: 6px; }
.sh .r { margin-left: auto; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text3); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; align-items: baseline; }
.kv > :nth-child(odd) { color: var(--text2); }
.kv > :nth-child(even) { font: 400 var(--fs-mono)/1.5 var(--mono); font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; color: var(--text); }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-micro); font-weight: 600; padding: 0 8px; border-radius: 9999px; white-space: nowrap; flex: none; line-height: 18px; }
.dot { width: 6px; height: 6px; border-radius: 9999px; display: inline-block; flex: none; }
.tag { font: 400 var(--fs-micro)/18px var(--mono); color: var(--text2); background: var(--elev); border-radius: 4px; padding: 0 6px; cursor: pointer; transition: background-color 160ms; }
.tag:hover { color: var(--text); background: var(--hover); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.stat { background: var(--panel); padding: 8px 10px; }
.stat b { display: block; font: 600 var(--fs-title)/1.35 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat span { font-size: var(--fs-micro); color: var(--text2); }
.bar { height: 4px; border-radius: 4px; background: var(--elev); overflow: hidden; display: flex; margin-top: 12px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: var(--fs-micro); color: var(--text2); }
.decision { border: 1px solid rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.05); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.decision .t { display: flex; align-items: center; gap: 6px; }
.decision .msg { white-space: pre-wrap; margin: 8px 0 10px; max-height: 240px; overflow: auto; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.disc { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: var(--panel); }
.disc > .dh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 36px; cursor: pointer; user-select: none; transition: background-color 160ms; }
.disc > .dh:hover { background: var(--elev); }
.disc > .dh .tri { color: var(--text3); width: 12px; height: 12px; flex: none; display: inline-flex; transition: transform 160ms; }
.disc.open > .dh .tri { transform: rotate(90deg); }
.disc > .db { padding: 0 12px 12px; display: none; border-top: 1px solid var(--border); }
.disc.open > .db { display: block; }
.disc .disc { margin: 8px 0 0; }
.prose { margin-top: 12px; }
.prose.aside { font-size: var(--fs-caption); line-height: 1.6; color: var(--text2); }   /* supporting text (rationale) steps down a level */
.prose b, .sub-h { display: flex; align-items: center; gap: 6px; font-size: var(--fs-micro); font-weight: 700; line-height: 1.4; color: var(--text2);
                    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.sub-h { margin: 16px 0 6px; }
.ev { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--border); align-items: baseline; }
.ev:last-child { border-bottom: none; }
.ev .t { font: 400 var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--text3); }
.ev .x { color: var(--text); line-height: 1.5; }
.ev .a { color: var(--text3); font-size: var(--fs-micro); margin-top: 1px; }
.ev .x { position: relative; padding-left: 14px; }
.ev .x::before { content: ""; position: absolute; left: 0; top: 6px; width: 6px; height: 6px; border-radius: 9999px; background: var(--hover); }
.ev.good .x::before { background: #22c55e; } .ev.dec .x::before { background: #f59e0b; } .ev.bad .x::before { background: #ef4444; }
.ev.bad .x { color: var(--error); }
.ev .a { padding-left: 14px; }
.thumb { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); margin-top: 8px; background: #fff; }
.empty { color: var(--text3); text-align: center; padding: 48px 16px; }

/* ---------- canvas overlays ---------- */
.overlay { position: absolute; z-index: 3; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
#zoombox { left: 12px; bottom: 12px; display: flex; padding: 3px; gap: 2px; align-items: center; }
#zoombox button { border: none; background: transparent; height: 28px; min-width: 28px; padding: 0 8px; color: var(--text2); }
#zoombox button:hover { background: var(--elev); color: var(--text); }
#zoombox button.on { color: var(--accent); background: var(--accent-bg); }
#zoombox .zl { font: 500 var(--fs-micro) var(--sans); font-variant-numeric: tabular-nums; color: var(--text3); width: 38px; text-align: center; }
#zoombox .sep { height: 16px; margin: 0 2px; }
#legend { right: 404px; bottom: 12px; padding: 7px 12px; display: flex; gap: 12px; font-size: var(--fs-micro); color: var(--text2); flex-wrap: wrap; }
#legend span { display: inline-flex; align-items: center; gap: 5px; }
#legend i { width: 10px; height: 10px; border-radius: 9999px; border: 2px solid; display: inline-block; background: var(--node-fill); }
#banner { left: calc((100% - 392px) / 2); top: 12px; transform: translateX(-50%); padding: 5px 5px 5px 12px; display: none; align-items: center; gap: 10px;
          border-color: rgba(245, 158, 11, 0.45); white-space: nowrap; font-weight: 500; }
#banner.show { display: flex; }
#tip { position: absolute; z-index: 6; pointer-events: none; background: color-mix(in srgb, var(--panel) 95%, transparent); backdrop-filter: blur(4px);
       border: 1px solid var(--tip-border); border-radius: 8px; padding: 8px 12px; box-shadow: var(--tip-shadow); max-width: 280px; display: none; }
#tip .n { font-size: var(--fs-caption); font-weight: 500; line-height: 1.4; color: var(--text); }
#tip .s { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: var(--fs-micro); color: var(--text2); }
#tip .s .k { color: var(--text3); }
#tip .d { font-size: var(--fs-micro); color: var(--text2); margin-top: 4px; line-height: 1.5; }
#toast { left: calc((100% - 392px) / 2); bottom: 16px; transform: translateX(-50%); padding: 8px 14px; z-index: 9; display: none; font-weight: 500; }

/* ---------- constellation nodes ---------- */
.cn { cursor: pointer; }
.cn .ring { fill: var(--node-fill); stroke-width: 2; }
.cn.folder .ring { stroke-width: 3; }
.cn .hit { fill: transparent; }
.cn .sel { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; transition: opacity 160ms; }
.cn.selected .sel { opacity: 1; }
.cn .lbl { font: 500 11px var(--sans); letter-spacing: 0; fill: color-mix(in srgb, var(--c) 78%, #000); transition: opacity 150ms; }   /* light: colour+cc reads too pale on #FAFAFA */
:root.dark .cn .lbl { fill: color-mix(in srgb, var(--c) 80%, transparent); }                                        /* dark: Eleforge's colour + cc */
.cn .sub { font: 400 10px var(--sans); font-variant-numeric: tabular-nums; fill: var(--text3); transition: opacity 150ms; }
.cn[data-id]:hover .lbl, .cn[data-id]:hover .sub { opacity: 0; }                                                    /* the tooltip takes over */
.cn.folder .lbl { font-size: 12px; font-weight: 600; letter-spacing: -0.005em; }   /* run > node on the canvas: weight, not a new size */
.cn .spin { transform-origin: 0 0; animation: cn-spin 1.2s linear infinite; }
.cn .spin circle { fill: none; stroke-width: 2.5; }
@keyframes cn-spin { to { transform: rotate(360deg); } }
.cn.breathe .body-g { animation: cn-breathe 3s ease-in-out infinite; }
@keyframes cn-breathe {
  0%, 100% { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--pulse) 40%, transparent)); opacity: .85; }
  50% { filter: drop-shadow(0 0 6px var(--pulse)) drop-shadow(0 0 12px color-mix(in srgb, var(--pulse) 30%, transparent)); opacity: 1; } }
.cn.attn .body-g { animation: cn-attn 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes cn-attn { 50% { opacity: .5; } }
.edge { fill: none; stroke-linejoin: round; stroke-linecap: round; transition: stroke-opacity 160ms, stroke-width 160ms; }
@media (prefers-reduced-motion: reduce) { .cn .spin, .cn.breathe .body-g, .cn.attn .body-g { animation: none; } }
@media (max-width: 900px) { #inspector { top: auto; left: 8px; width: auto; height: 45%; } #legend, #topstatus, #who { display: none; }
  #banner, #toast { left: 50%; } }
</style>
</head>
<body>
<div id="top">
  <div class="brand">forge<b>flow</b></div>
  <div class="sep"></div>
  <select id="runselect" aria-label="run"></select>
  <div id="topstatus"></div>
  <div class="sp"></div>
  <div id="topacts" class="row"></div>
  <div id="who"></div>
  <button class="ghost" id="theme" title="toggle light / dark">Theme</button>
</div>
<div id="canvas">
  <div id="banner" class="overlay"></div>
  <div id="tip"></div>
  <div id="toast" class="overlay"></div>
  <div id="zoombox" class="overlay"><button id="zout" title="zoom out">−</button><span class="zl" id="zl">100%</span><button id="zin" title="zoom in">+</button>
    <span class="sep"></span><button id="zfit" title="fit to view">Fit</button><button id="zlabels" title="show / hide node labels">Labels</button></div>
  <div id="legend" class="overlay"></div>
</div>
<aside id="inspector">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="run">Run</div>
    <div class="tab" data-tab="node">Node</div>
    <div class="tab" data-tab="timeline">Timeline</div>
    <div class="tab" data-tab="history">Plan history</div>
  </div>
  <div id="pane"><div class="empty">Loading…</div></div>
</aside>
<script>
"use strict";
const TOKEN = "__FLOWER_TOKEN__";
const ACTOR = "__FLOWER_ACTOR__";
const VERSION = "__FLOWER_VERSION__";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const S = { runs: [], runId: null, run: null, tab: "run", node: null, nodeData: null, nodeSig: null, view: null, hover: null,
            labels: store.get("flower-labels") !== "off",
            pendingNode: location.hash.startsWith("#node=") ? decodeURIComponent(location.hash.slice(6)) : null };

// Eleforge canvas TYPE_COLORS (constellation-node-helpers.ts) mapped onto flower node kinds.
const TYPE = {
  agent:    { color: "#38bdf8", name: "Agent",    icon: "bot" },       // BOT
  gate:     { color: "#a78bfa", name: "Human",    icon: "user" },      // HUMAN
  job:      { color: "#fb923c", name: "HPC job",  icon: "layers" },    // STANDARD_DAG
  shell:    { color: "#818cf8", name: "Shell",    icon: "terminal" },  // DEFAULT
  function: { color: "#34d399", name: "Function", icon: "braces" },    // EMBED
  wait:     { color: "#fbbf24", name: "Wait",     icon: "clock" },     // CONTINUE
  foreach:  { color: "#c084fc", name: "Fan-out",  icon: "split" },     // RESULT
};
const CHECKPOINT = "#f59e0b", FAILED = "#ef4444";
const STATUS = {   // Eleforge statusLabel wording; colours of its tooltip status dot
  pending: ["Pending", "#a8a29e"], running: ["Running", "#3b82f6"], succeeded: ["Completed", "#22c55e"],
  failed: ["Failed", "#ef4444"], waiting: ["Waiting for input", "#f59e0b"], retrying: ["Retrying", "#8b5cf6"],
  skipped: ["Skipped", "#a8a29e"], cancelled: ["Cancelled", "#ef4444"], parked: ["Waiting for input", "#f59e0b"],
  awaiting_approval: ["Awaiting approval", "#f59e0b"], rejected: ["Rejected", "#ef4444"],
};
const ICONS = {  // Lucide path data (24x24 stroke icons)
