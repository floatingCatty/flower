# A reproducibility protocol exported from run a24-20261005-072811-bb36 (`flower export`): the steps behind
# analysis. Run it with `flower run protocol.yaml -y`, then `flower compare RUN expected.json`.
flower: 1
id: a24
title: 'Reproduce the A24 benchmark interaction energies of 24 small noncovalent dimers (Rezac and Hobza, JCTC 9,
  2151 (2013)) at the CCSD(T)/CBS level: MP2/CBS from aug-cc-pVTZ/QZ plus a CCSD(T) correction in aug-cc-pVTZ, counterpoise
  corrected'
description: |
  Reproduce the A24 benchmark interaction energies of 24 small noncovalent dimers (Rezac and Hobza, JCTC 9, 2151 (2013)) at the CCSD(T)/CBS level: MP2/CBS from aug-cc-pVTZ/QZ plus a CCSD(T) correction in aug-cc-pVTZ, counterpoise corrected
inputs:
  host:
    type: string
    required: true
  ssh_options:
    type: array
    required: true
clusters:
  remote:
    transport: ssh
    host: ${inputs.host}
    ssh_options: ${inputs.ssh_options}
    scheduler: none
    remote_root: ~/flower-runs
    min_poll: 15s
    cpus: 32
  remote-quick:
    transport: ssh
    host: ${inputs.host}
    ssh_options: ${inputs.ssh_options}
    scheduler: none
    remote_root: ~/flower-runs
    min_poll: 5s
nodes:
- id: refs
  kind: shell
  description: 'The A24 database file of Psi4 (tag v1.9.1, sha256): the 24 dimer geometries split into fragments,
    and the reference interaction energies (kcal/mol) of Rezac and Hobza. Read n (24 when intact) and names.'
  outputs:
    n: integer
    names: array
    atoms: array
  files:
    data: a24.json
    source: A24.py
  run: curl -fsSL -o A24.py https://raw.githubusercontent.com/psi4/psi4/v1.9.1/psi4/share/psi4/databases/A24.py
    && sha256sum A24.py && python3 ${plan.dir}/a24.py data A24.py | tail -n 1 > "$FLOWER_OUTPUTS"
- id: calc
  kind: shell
  title: Dimer ${item.i}, ${item.level}
  description: 'One dimer at one level, counterpoise corrected, frozen core: HF and MP2 correlation interaction
    energies in aug-cc-pVTZ or QZ (density fitting), or CCSD(T)-MP2 in aug-cc-pVTZ. The parts of CCSD(T)/CBS that
    the analysis adds up.'
  cluster: remote
  environment: pyscf
  stage_in:
  - a24.py
  - ${refs.files.data}
  tmpdir: job
  env:
    OMP_NUM_THREADS: '8'
  timeout:
    total: 12h
  resources:
    cpus_per_task: 8
    mem: 30G
  foreach:
  - i: 1
    level: ccsdt-atz
  - i: 2
    level: ccsdt-atz
  - i: 3
    level: ccsdt-atz
  - i: 4
    level: ccsdt-atz
