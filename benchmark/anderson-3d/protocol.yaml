    - node_fail
    - timeout
  on_failure: continue
  run: python3 tm.py run ${item.L} ${item.W} 0.001 30000000 ${item.seed} | tail -n 1 > "$FLOWER_OUTPUTS"
- id: fss-selftest
  kind: shell
  cluster: here
  description: 'The scaling fit on synthetic data drawn from its own model (W_c 16.54, nu 1.57, y -2.8, 0.1% noise,
    the paper''s sizes and W grid): it must recover W_c and nu inside its 95% intervals before it is trusted with
    the campaign.'
  environment: analysis
  outputs:
    ok: boolean
    Wc: array
    nu: array
    Q: number
  run: python3 ${plan.dir}/fss.py selftest | tail -n 1 > "$FLOWER_OUTPUTS"
- id: fss
  kind: shell
  description: 'The finite-size-scaling fit of all 91 points: with corrections to scaling (the paper''s box fit,
    12 parameters) and without them on L >= 8 near W_c, W_c, nu and Lambda_c with 95% intervals from 200 resampled
    fits, against Tables II and III. Read n_reproduced of n_claims and report.md.'
  needs:
  - fss-selftest
  cluster: here
  environment: analysis
  outputs:
    n_claims: integer
    n_reproduced: integer
    Wc: array
    nu: array
    Lc: array
    Q: number
    n_points: integer
  files:
    report: report.md
    figure: fss.png
    fits: fss.json
  inputs:
    tables: ${paper.files.tables}
    points: ${tm.outputs.items}
  run: python3 ${plan.dir}/fss.py | tail -n 1 > "$FLOWER_OUTPUTS"
