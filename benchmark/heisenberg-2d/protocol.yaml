# A reproducibility protocol exported from run heisenberg-2d-20261004-172331-d4e1 (`flower export`): the steps behind
# fits. Run it with `flower run protocol.yaml -y`, then `flower compare RUN expected.json`.
flower: 1
id: heisenberg-2d
title: 'Reproduce the ground-state parameters of the 2D S=1/2 Heisenberg antiferromagnet by stochastic series expansion
  QMC and finite-size scaling: E = -0.669437(5), M = 0.3070(3), rho_s = 0.175(2), chi = 0.0625(9), c = 1.673(7),
  and the per-size data of Table II (Sandvik, PRB 56, 11678 (1997), arXiv:cond-mat/9707123)'
description: |
  Reproduce the ground-state parameters of the 2D S=1/2 Heisenberg antiferromagnet by stochastic series expansion QMC and finite-size scaling: E = -0.669437(5), M = 0.3070(3), rho_s = 0.175(2), chi = 0.0625(9), c = 1.673(7), and the per-size data of Table II (Sandvik, PRB 56, 11678 (1997), arXiv:cond-mat/9707123)
inputs:
  host:
    type: string
    required: true
    description: ssh alias of the remote machine
  ssh_options:
    type: array
    required: true
    description: extra ssh/rsync options, e.g. ["-F", "/path/ssh_config"]
clusters:
  remote:
    transport: ssh
    host: ${inputs.host}
    ssh_options: ${inputs.ssh_options}
    scheduler: none
    remote_root: ~/flower-runs
    min_poll: 15s
    cpus: 32
nodes:
- id: paper
  kind: shell
  title: The paper (arXiv PDF, sha256) and its Table II parsed from the text layer
  description: 'Downloads the paper and parses its Table II (E, S(pi,pi), C(L/2,L/2) for L = 4..16, with errors),
    the per-size data every later comparison uses. Read table2_rows: 7 means the table was found intact.'
  outputs:
    sha256_pdf: string
    table2_rows: integer
  files:
    pdf: paper.pdf
    table2: table2.json
  run: curl -fsSL -A "Mozilla/5.0" -o paper.pdf https://arxiv.org/pdf/cond-mat/9707123v1 && pdftotext -layout paper.pdf
    paper.txt && python3 ${plan.dir}/table2.py | tail -n 1 > "$FLOWER_OUTPUTS"
- id: verify
  kind: shell
  title: 'SSE kernel vs exact diagonalization at 4x4 (energy, S(pi,pi), stiffness: the paper''s Table I)'
  description: 'Checks the SSE kernel before any campaign: at 4x4 its energy and S(pi,pi) must match exact diagonalization
    (the paper''s Table I) and its stiffness the ed-twist value, every sampled configuration must be periodic with
    whole windings. ok=true means the kernel can be trusted.'
  needs:
  - ed-twist
  cluster: remote
  environment: numba
  stage_in:
  - ${plan.dir}/sse.py
  timeout:
    total: 1h
  outputs:
    ok: boolean
  run: python3 sse.py check | tail -n 1 | tee "$FLOWER_OUTPUTS"
- id: ed-twist
  kind: shell
  title: Exact 4x4 stiffness from a twisted boundary (independent of the QMC estimator)
  description: 'Exact diagonalization of the 4x4 lattice with a twist on every x bond: an independent value of the
    spin stiffness rho_s(4) for the verify step. It gives 0.2783, not the paper''s quoted 0.0484 (a different finite-size
    normalization).'
  cluster: remote
  environment: quspin
  stage_in:
  - ${plan.dir}/ed_twist.py
  outputs:
    rho_s: number
    E0_per_site: number
    Wx2_implied: number
  run: OMP_NUM_THREADS=1 python3 ed_twist.py 32 | tail -n 1 | tee "$FLOWER_OUTPUTS"
- id: sse
  kind: shell
  title: 'SSE L=${item.L} beta=8L chain ${item.seed}: 250000 sweeps'
  description: 'The campaign: SSE quantum Monte Carlo at beta = 8L for L = 4..16, 8-16 independent chains of 250000
    sweeps per size. Each item''s E, S, C, rho, chi are bin averages for one chain; the fits step combines them.'
