flower: 1
id: fcc-catalyst-screening
title: Screening fcc metals for atomic-oxygen binding (EMT toy model)
description: |
  Which fcc metals bind atomic oxygen closest to a target adsorption energy (a Sabatier-style
  descriptor for oxidation catalysis)? An agent chooses and justifies the candidates; Slurm jobs fit
  each metal's lattice constant and compute O adsorption on relaxed (111) slabs; a measured reference
  value is awaited from the lab; an agent analyses the results and may add a slab-thickness
  convergence check; a human reviews the conclusion before the final report is written.
  EMT is a toy potential — the point of this example is the workflow, not the chemistry.

inputs:
  target_eads: {type: number, default: -0.5, description: ideal O adsorption energy in eV}
  n_candidates: {type: integer, default: 4, description: how many metals to screen}
  python: {type: string, default: python3, description: Python with ASE + matplotlib for the jobs}
  fakeslurm: {type: string, description: bin dir of the (fake) Slurm used by this example}

defaults:
  harness: {name: codex, model: gpt-5.5}
  timeout: {total: 30m, idle: 15m}
  retry: {max_attempts: 2, backoff: 3s}

clusters:
  hpc:
    transport: local
    bin_dir: ${inputs.fakeslurm}
    min_poll: 2s
    max_jobs: 3
    lost_after: 120s
    env: {OMP_NUM_THREADS: "1", OPENBLAS_NUM_THREADS: "1"}
    resources: {partition: cpu, ntasks: 1, time: "00:20:00"}

results: [report, plot]

nodes:
  - id: choose
    kind: agent
    title: Choose candidate metals
    prompt: |
      You are planning a small computational screening study.
      Question: which fcc metals bind atomic oxygen on the (111) surface closest to a target adsorption
      energy of ${inputs.target_eads} eV (relative to 1/2 O2)? The only metals our potential (ASE EMT)
      supports are: Ag, Al, Au, Cu, Ni, Pd, Pt.
      Pick exactly ${inputs.n_candidates} of them that make the comparison informative (span weak to strong
      binders, include at least one classic oxidation catalyst). Do not run any calculations.
    outputs:
      metals: {type: array, items: {type: string, enum: [Ag, Al, Au, Cu, Ni, Pd, Pt]},
               description: "the chosen metals, element symbols"}
    timeout: {total: 10m}

  - id: lattice
    kind: job
    title: Lattice constant (EOS fit)
    cluster: hpc
    foreach: "${choose.outputs.metals}"
    resources: {time: "00:05:00"}
    script: |
      ${inputs.python} ${plan.dir}/jobs/eos.py ${item}
    outputs: {metal: string, a0: number, bulk_modulus_GPa: number}
    retry: {max_attempts: 3, backoff: 2s}

  - id: adsorption
    kind: job
    title: O adsorption on relaxed (111)
    cluster: hpc
    foreach: "${lattice.outputs.items}"
    resources: {time: "00:10:00"}
    script: |
      ${inputs.python} ${plan.dir}/jobs/ads.py --metal ${item.metal} --a0 ${item.a0} --layers 4
    outputs: {metal: string, e_ads: number, converged: boolean}
    files: {structure: final.xyz}
    retry: {max_attempts: 3, backoff: 2s}

  - id: reference
    kind: wait
    title: Experimental reference value from the lab
    signal: lab-reference
    deadline: 2h

  - id: analyze
    kind: agent
    title: Rank candidates, judge convergence
    needs: [adsorption, reference]
    prompt: |
      Analyse a screening study of O adsorption on fcc(111) surfaces (ASE EMT toy potential).
      Target adsorption energy: ${inputs.target_eads} eV. Results (one per metal, 4-layer slabs):
      ${adsorption.outputs.items}
      Lab reference (may be empty if the deadline passed): ${reference.outputs.data}

      1. Rank the metals by |E_ads - target| (best first) and pick the best one.
      2. Decide whether the 4-layer slab result for the best metal needs a slab-thickness convergence
         check. If yes, propose ONE plan amendment that inserts a job right after this node:
         {"rationale": "...", "ops": [{"op": "detour", "after": "analyze", "nodes": [
            {"id": "converge", "kind": "job", "cluster": "hpc", "title": "6-layer convergence check",
             "script": "${inputs.python} ${plan.dir}/jobs/ads.py --metal <BEST> --a0 <A0 OF BEST> --layers 6",
             "outputs": {"e_ads": "number"}, "resources": {"time": "00:10:00"}}]}]}
         (replace <BEST> and <A0 OF BEST> with literal values from the results).
      Reviewer feedback from a previous pass, if any (address it explicitly): ${feedback}
    outputs:
      ranking: {type: array, items: {type: string}}
      best: string
      needs_convergence_check: boolean
    effects:
      amend: {auto_approve: true, max_nodes: 1, kinds: [job], ops: [detour]}
    timeout: {total: 15m}

  - id: plot
    kind: function
    title: Descriptor plot
    needs: [analyze]
    python: ${inputs.python}
    call: science:plot_descriptor
    args: {results: "${adsorption.outputs.items}", target: "${inputs.target_eads}"}
    outputs: {plot: path, best_by_descriptor: string}
    files: {plot: descriptor.png}

  - id: review
    kind: gate
    title: Scientist reviews the conclusion
    needs: [plot]
    message: |
      Best candidate: ${analyze.outputs.best} (ranking ${analyze.outputs.ranking}).
      Agent's reasoning: ${analyze.summary}
      Plot: ${plot.files.plot}
      Approve to write the final report, or answer 'revise' with what the analysis should reconsider.
    decisions: [approve, revise, abort]
    on_reject: {rerun: [analyze], max_attempts: 2}

  - id: report
    kind: agent
    title: Write the study report
    needs: [review]
    prompt: |
      Write REPORT.md in your working directory: a one-page report of this screening study for a
      materials scientist. Include the question (target ${inputs.target_eads} eV), the candidate choice
      and its justification (${choose.summary}), a results table built from
      ${adsorption.outputs.items}, the lattice constants ${lattice.outputs.items}, the ranking and best
      metal (${analyze.outputs.ranking}, ${analyze.outputs.best}), the convergence check if one was run
      (look for a file ${run.dir}/nodes/converge/a1/job/outputs.json), the lab reference
      (${reference.outputs.data}), the reviewer's decision (${review.outputs.text}) and an honest
      limitations section (EMT is a toy potential). Embed the plot: ${plot.files.plot}
    outputs: {headline: string}
    files: {report: REPORT.md}
    timeout: {total: 15m}
