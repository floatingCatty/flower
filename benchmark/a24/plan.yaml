  - id: diag-ar
    kind: shell
    description: 'Why the argon dimers (20, 21) failed with nocc = 0 in MP2: the nuclear charges PySCF reports for Ar and for a ghost Ar, the electron count and the frozen-core count a24.py derives, for each of the three counterpoise calculations of dimer 20. Read rows.'
    cluster: remote-quick
    environment: pyscf
    stage_in:
    - a24.py
    - ${refs.files.data}
    resources:
      cpus_per_task: 1
    outputs:
      rows: array
    run: |-
      python3 -c "
      import json, a24
      from pyscf import gto
      rec = [r for r in json.load(open(\"a24.json\")) if r[\"index\"] == 20][0]
      rows = []
      for tag, s in ((\"dimer\", a24.atoms(rec[\"A\"]) + \"; \" + a24.atoms(rec[\"B\"])), (\"A+ghostB\", a24.atoms(rec[\"A\"]) + \"; \" + a24.atoms(rec[\"B\"], ghost=True)), (\"ghostA+B\", a24.atoms(rec[\"A\"], ghost=True) + \"; \" + a24.atoms(rec[\"B\"]))):
          m = gto.M(atom=s, basis=\"aug-cc-pvtz\", verbose=0)
          z = [float(q) for q in m.atom_charges()]
          nfc = int(sum(1 for q in z if q > 2) + sum(4 for q in z if q > 10))
          rows.append({\"calc\": tag, \"symbols\": [m.atom_symbol(i) for i in range(m.natm)], \"charges\": z, \"nelec\": m.nelectron, \"nfc\": nfc})
      print(json.dumps({\"rows\": rows}))
      " > "$FLOWER_OUTPUTS"

  - id: analysis
    kind: shell
    description: 'CCSD(T)/CBS per dimer from this run''s parts (HF/aQZ + MP2 correlation extrapolated aTZ-aQZ + [CCSD(T)-MP2]/aTZ) against the A24 references: every dimer within 0.1 kcal/mol, and the mean absolute deviation below 0.05. Read n_within of n_complete, mad, and report.md.'
    environment: analysis
    outputs:
      n_complete: integer
      n_within: integer
      mad: number
      max_abs: number
      n_claims: integer
      n_reproduced: integer
    files:
      report: report.md
      figure: a24.png
      data: analysis.json
    inputs:
      data: ${refs.files.data}
      results: ${calc.outputs.items}
    run: python3 ${plan.dir}/analysis.py | tail -n 1 > "$FLOWER_OUTPUTS"
