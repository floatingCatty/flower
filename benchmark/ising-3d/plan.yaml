      clusters_per_measurement: integer
      U4_at_K0: number
      seconds: number
      resumed: boolean
    files:
      series: series.npz
    retry:
      max_attempts: 2
    run: python3 wolff.py ${item.L} ${item.seed} ${item.n} | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: fss
    kind: shell
    title: 'Finite-size scaling: nu and Kc with jackknife errors (L >= 12)'
    environment: analysis
    timeout:
      total: 2h
    outputs:
      Kc: number
      Kc_err: number
      nu: number
      nu_err: number
      n_reproduced: integer
      n_claims: integer
      sizes: array
      measurements: integer
    files:
      report: report.md
      figure: fss.png
      data: fss.json
    inputs:
      runs: ${mc.outputs.items}
      lmin: '12'
    run: python3 ${plan.dir}/fss.py | tail -n 1 > "$FLOWER_OUTPUTS"

  - id: fss-preview
    kind: shell
    title: FSS on the chains finished so far (preview)
    environment: analysis
    outputs:
      sizes: array
    files:
      report: report.md
      figure: fss.png
    inputs:
      runs: ${mc.partial}
      lmin: '12'
    run: python3 ${plan.dir}/fss.py | tail -n 1 > "$FLOWER_OUTPUTS"
